<h2>Anmelden</h2>
<p>Gib diesen Code in der App ein:</p>
<p style="font-size: 28px; font-weight: bold; letter-spacing: 6px">{{ .Token }}</p>
<p>Oder tipp auf dem Handy, auf dem die App läuft, auf diesen Link:</p>
<p><a href="{{ .ConfirmationURL }}">Jetzt anmelden</a></p>
<p>Der Code ist eine Stunde gültig. Wenn du dich nicht anmelden wolltest, ignorier diese E-Mail.</p>
